name: Trigger Railway stats refresh

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway refresh endpoint
        run: |
          curl -sS -f -X POST \
            --retry 5 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_REFRESH_TOKEN }}" \
            https://git-stats-animation-production.up.railway.app/refresh
